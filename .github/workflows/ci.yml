name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # selfcheck includes the bundle drift guard: it fails if
      # rewrite-assistant.json was not rebuilt after a source change.
      # Ubuntu defaults to LF on checkout; .gitattributes overrides that to
      # CRLF for the three coupled files - running here proves the override
      # actually holds, so a regression there fails here first.
      - run: node selfcheck.mjs
      - run: node build.mjs
      # The build must be a no-op on a clean tree: if it changed the bundle,
      # the commit shipped a stale artifact.
      - run: git diff --exit-code rewrite-assistant.json
